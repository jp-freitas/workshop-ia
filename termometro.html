<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Termômetro · IA na Prática</title><link rel="stylesheet" href="css/style.css"></head><body>
<main>
<h1>Termômetro</h1>
<div id="box" class="card"></div>
</main>
<script type="module">
import { $, $$, header, esc, deviceId, AFIRMACOES } from './js/common.js';
import { dbSet, dbOn } from './js/db.js';
header('Termômetro', { precisaIdentificar:false });
let est=null, minha=null; const dev=deviceId();
function draw(){
  const box=$('#box');
  if(!est||!est.q){ box.innerHTML='<p>Aguarde: o facilitador vai abrir a próxima afirmação.</p>'; return; }
  const q=est.q, fase=est.fase||'inicio';
  box.innerHTML=`<p class="mut">${fase==='fim'?'Final':'Início'} · Afirmação ${q}</p><p style="font-size:22px;font-weight:700">${esc(AFIRMACOES[q-1])}</p>
  <div class="tri"><button data-v="v" style="background:var(--ok)">SIM</button><button data-v="a" style="background:var(--yl)">DEPENDE</button><button data-v="r" style="background:var(--rd)">NÃO</button></div>
  <p class="mut" id="msg" style="text-align:center;margin-top:12px">${minha?'Resposta registrada. Você pode mudar enquanto estiver aberto.':''}</p>`;
  $$('#box [data-v]').forEach(b=>{ if(minha===b.dataset.v) b.style.outline='6px solid var(--ink)'; b.onclick=async()=>{ minha=b.dataset.v; await dbSet(`termometro/${fase}/${q}/${dev}`,minha); draw(); }; });
}
dbOn('estado/termometro', v=>{ est=v; minha=null; draw(); if(v&&v.q) import('./js/db.js').then(m=>m.dbOnce(`termometro/${v.fase||'inicio'}/${v.q}/${dev}`)).then(x=>{ if(x&&!minha){ minha=x; draw(); } }); });
draw();
</script></body></html>
